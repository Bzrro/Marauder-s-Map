<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Mi Mapa</title>

<!-- PWA: manifest, íconos y metadatos para que se instale como app -->
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#3c2a1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mi Mapa">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English&family=MedievalSharp&display=swap" rel="stylesheet">
<style>
  /* Nota: la tipografía "pergamino" (Google Fonts) y el filtro sepia sobre el mapa
     necesitan conexión a internet normal para cargar bien — en la vista previa de
     Claude puede no cargar la fuente, pero en GitHub Pages sí. */
  :root{
    --bg:#cdb98a;
    --panel:#3c2a1a;
    --panel2:#4d3722;
    --accent:#c9a227;
    --accent2:#7a2020;
    --text:#f2e6c8;
    --muted:#d8c79b;
    --border:#6b4f30;
  }
  *{box-sizing:border-box;}
  html,body{height:100dvh;margin:0;background:var(--bg);color:var(--text);font-family:'IM Fell English',Georgia,'Times New Roman',serif;}
  #map{position:absolute;top:0;left:0;right:0;bottom:0;z-index:1;}
  /* tiñe las teselas de OpenStreetMap a tono sepia/pergamino */
  .leaflet-tile-pane{
    filter: sepia(0.75) saturate(2.1) hue-rotate(-18deg) brightness(0.92) contrast(1.05);
    transition: filter .4s ease;
  }
  /* modo "mapa normal": sin filtro sepia, colores reales de OpenStreetMap */
  body.normal-map .leaflet-tile-pane{
    filter:none;
  }
  /* viñeta de bordes envejecidos alrededor del mapa */
  #map::after{
    content:'';position:absolute;inset:0;pointer-events:none;z-index:400;
    box-shadow: inset 0 0 10vw 3vw rgba(60,40,20,0.65);
    transition: box-shadow .4s ease;
  }
  body.normal-map #map::after{
    box-shadow:none;
  }
  h3, #modalTitle, #nameModal .box h3{font-family:'MedievalSharp',cursive;}

  #topbar{
    position:absolute;top:0;left:0;right:0;z-index:500;
    padding:10px;display:flex;gap:8px;
    background:linear-gradient(180deg,rgba(15,17,21,0.95),rgba(15,17,21,0));
    pointer-events:none;
  }
  #topbar > *{pointer-events:auto;}
  #search{
    flex:1;padding:12px 14px;border-radius:14px;border:1px solid var(--border);
    background:var(--panel);color:var(--text);font-size:15px;outline:none;
  }
  #search::placeholder{color:var(--muted);}
  #goBtn{
    padding:0 16px;border-radius:14px;border:none;background:var(--accent);
    color:#08131f;font-weight:600;font-size:15px;
  }

  #modeBar{
    position:absolute;top:60px;left:10px;right:10px;z-index:500;
    display:flex;gap:6px;pointer-events:none;
  }
  #modeBar > *{pointer-events:auto;}
  .mode-btn{
    padding:8px 12px;border-radius:20px;border:1px solid var(--border);
    background:var(--panel);color:var(--muted);font-size:13px;
  }
  .mode-btn.active{background:var(--accent);color:#08131f;border-color:var(--accent);font-weight:600;}

  #fabs{
    position:absolute;right:10px;z-index:500;
    bottom:calc(90px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:10px;
  }
  .fab{
    width:50px;height:50px;border-radius:50%;border:1px solid var(--border);
    background:var(--panel);color:var(--text);font-size:20px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 14px rgba(0,0,0,0.4);
  }
  .fab.danger{background:var(--accent2);color:#2a0505;border-color:var(--accent2);}
  .fab.on{background:var(--accent);color:#08131f;border-color:var(--accent);}

  #bottomSheet{
    position:absolute;left:0;right:0;bottom:0;z-index:600;
    background:var(--panel);border-top:1px solid var(--border);
    border-radius:18px 18px 0 0;
    max-height:60vh;overflow-y:auto;
    transform:translateY(100%);transition:transform .25s ease;
  }
  #bottomSheet.open{transform:translateY(0);}
  #sheetHandle{
    display:flex;justify-content:center;padding:8px 0 2px;
  }
  #sheetHandle span{width:36px;height:4px;border-radius:2px;background:var(--border);}
  #sheetContent{padding:6px 16px calc(20px + env(safe-area-inset-bottom));}
  #sheetContent h3{margin:8px 0;font-size:15px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
  .list-item{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 12px;background:var(--panel2);border-radius:12px;margin-bottom:8px;
  }
  .list-item .info{display:flex;flex-direction:column;gap:2px;}
  .list-item .name{font-size:14px;font-weight:600;}
  .list-item .sub{font-size:12px;color:var(--muted);}
  .list-item button{
    background:none;border:none;color:var(--accent2);font-size:18px;padding:4px 8px;
  }
  .empty-msg{color:var(--muted);font-size:13px;padding:8px 0 16px;}

  #routeInfo{
    position:absolute;left:10px;right:10px;z-index:500;
    bottom:calc(10px + env(safe-area-inset-bottom));
    background:var(--panel);border:1px solid var(--border);border-radius:14px;
    padding:12px 14px;display:none;flex-direction:column;gap:9px;
    box-shadow:0 4px 14px rgba(0,0,0,0.4);
  }
  #routeInfo.show{display:flex;}
  .route-bottom-row{display:flex;align-items:center;justify-content:space-between;}
  #routeInfo .txt{font-size:14px;}
  #routeInfo .txt b{font-size:16px;}
  #routeInfo .warn{color:#ffb84d;font-size:12px;display:block;margin-top:2px;}
  #routeChips{display:flex;gap:8px;flex-wrap:wrap;}
  #routeChips:empty{display:none;}
  .route-chip{
    display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:10px;
    border:1.5px solid var(--border);background:var(--panel2);color:var(--text);font-size:12px;
  }
  .route-chip .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .route-chip.active{border-color:var(--accent);font-weight:700;}
  #routeInfo button{
    background:var(--panel2);border:1px solid var(--border);color:var(--text);
    border-radius:10px;padding:8px 12px;font-size:13px;
  }

  #toast{
    position:absolute;left:50%;top:14px;transform:translateX(-50%);
    background:var(--panel2);border:1px solid var(--border);
    padding:10px 16px;border-radius:10px;font-size:13px;z-index:900;
    opacity:0;pointer-events:none;transition:opacity .25s;
  }
  #toast.show{opacity:1;}

  .leaflet-container{background:var(--bg);}

  .footstep-icon{background:none;border:none;}
  .footstep-icon .footstep{
    width:7px;height:7px;border-radius:50%;
    background:var(--accent2);
    box-shadow:0 0 0 2px rgba(255,255,255,0.5);
  }

  #nameModal{
    position:absolute;inset:0;z-index:1000;background:rgba(0,0,0,0.5);
    display:none;align-items:center;justify-content:center;
  }
  #nameModal.show{display:flex;}
  #nameModal .box{
    background:var(--panel);border:1px solid var(--border);border-radius:16px;
    padding:20px;width:85%;max-width:340px;
  }
  #nameModal h3{margin:0 0 12px;font-size:16px;}
  #nameModal input{
    width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);
    background:var(--panel2);color:var(--text);font-size:14px;margin-bottom:12px;
  }
  #nameModal .row{display:flex;gap:8px;justify-content:flex-end;}
  #nameModal button{padding:9px 16px;border-radius:10px;border:none;font-size:14px;}
  #nameModal .cancel{background:var(--panel2);color:var(--muted);}
  #nameModal .ok{background:var(--accent);color:#08131f;font-weight:600;}

  #zoneTypeModal{
    position:absolute;inset:0;z-index:1000;background:rgba(0,0,0,0.5);
    display:none;align-items:center;justify-content:center;
  }
  #zoneTypeModal.show{display:flex;}
  #zoneTypeModal .box{
    background:var(--panel);border:1px solid var(--border);border-radius:16px;
    padding:20px;width:88%;max-width:380px;
  }
  #zoneTypeModal h3{margin:0 0 14px;font-size:16px;}
  .zone-type-options{display:flex;flex-direction:column;gap:10px;margin-bottom:14px;}
  .zone-type-btn{
    text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--border);
    background:var(--panel2);color:var(--text);font-size:14px;font-weight:600;
    display:flex;flex-direction:column;gap:3px;
  }
  .zone-type-btn span{font-size:12px;color:var(--muted);font-weight:400;}
  #zoneTypeModal .cancel{background:var(--panel2);color:var(--muted);padding:9px 16px;border-radius:10px;border:none;font-size:14px;width:100%;}
</style>
</head>
<body>

<div id="map"></div>

<div id="topbar">
  <input id="search" type="text" placeholder="Buscar destino..." />
  <button id="goBtn">Ir</button>
</div>

<div id="modeBar">
  <button class="mode-btn active" data-profile="foot">🚶 A pie</button>
  <button class="mode-btn" data-profile="bike">🚲 Bici</button>
  <button class="mode-btn" data-profile="driving">🚗 Auto</button>
  <button class="mode-btn" id="btnToggleMap" title="Alternar mapa pergamino / normal" style="margin-left:auto;">🪄</button>
</div>

<div id="fabs">
  <button class="fab" id="btnLocate" title="Mi ubicación">📍</button>
  <button class="fab" id="btnSetOrigin" title="Marcar mi punto de partida a mano">📌</button>
  <button class="fab" id="btnFavorite" title="Guardar lugar">⭐</button>
  <button class="fab danger" id="btnZone" title="Marcar zona a evitar">⛔</button>
  <button class="fab" id="btnList" title="Lugares y zonas">📋</button>
  <button class="fab" id="btnPreset" title="Cargar zonas sugeridas">📰</button>
</div>

<div id="routeInfo">
  <div id="routeChips"></div>
  <div class="route-bottom-row">
    <div class="txt">
      <b id="routeDist">--</b> · <span id="routeDur">--</span>
      <span class="warn" id="routeWarn" style="display:none;">⚠️ No se pudo evitar del todo una zona marcada</span>
    </div>
    <button id="btnClearRoute">Cancelar</button>
  </div>
</div>

<div id="bottomSheet">
  <div id="sheetHandle"><span></span></div>
  <div id="sheetContent">
    <h3>Lugares favoritos</h3>
    <div id="favList"></div>
    <h3>Zonas a evitar</h3>
    <div id="zoneList"></div>
  </div>
</div>

<div id="toast"></div>

<div id="nameModal">
  <div class="box">
    <h3 id="modalTitle">Nombre del lugar</h3>
    <input id="modalInput" type="text" placeholder="Ej: Casa, Trabajo..." />
    <div class="row">
      <button class="cancel" id="modalCancel">Cancelar</button>
      <button class="ok" id="modalOk">Guardar</button>
    </div>
  </div>
</div>

<div id="zoneTypeModal">
  <div class="box">
    <h3>¿Qué tipo de zona a evitar?</h3>
    <div class="zone-type-options">
      <button class="zone-type-btn" id="ztPunto">📍 Punto con radio<span>tocás un lugar y le das un radio en metros</span></button>
      <button class="zone-type-btn" id="ztBarrio">🏘️ Barrio<span>buscás el nombre, se marca su forma real</span></button>
      <button class="zone-type-btn" id="ztCalle">🛣️ Tramo de calle<span>marcás dos puntos y un ancho a los costados</span></button>
    </div>
    <div class="row"><button class="cancel" id="ztCancel">Cancelar</button></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

function normalizarTexto(s){
  return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
}
function buscarBarrio(consulta){
  const q = normalizarTexto(consulta);
  const nombres = Object.keys(BARRIOS_TODOS);
  // match exacto primero, si no, el primero que contenga la consulta
  let encontrado = nombres.find(n => normalizarTexto(n) === q);
  if(!encontrado) encontrado = nombres.find(n => normalizarTexto(n).includes(q));
  return encontrado || null;
}
function corridorToPolygon(a, b, bufferMeters){
  const br = bearing(a, b);
  const perp1 = (br + 90) % 360;
  const perp2 = (br - 90 + 360) % 360;
  return [
    destPoint(a, perp1, bufferMeters),
    destPoint(b, perp1, bufferMeters),
    destPoint(b, perp2, bufferMeters),
    destPoint(a, perp2, bufferMeters)
  ];
}

/* ---------- Utilidades geo ---------- */
function toRad(d){ return d*Math.PI/180; }
function toDeg(r){ return r*180/Math.PI; }

function haversine(a,b){
  const R=6371000;
  const dLat=toRad(b.lat-a.lat), dLng=toRad(b.lng-a.lng);
  const s=Math.sin(dLat/2)**2 + Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}
function bearing(a,b){
  const y=Math.sin(toRad(b.lng-a.lng))*Math.cos(toRad(b.lat));
  const x=Math.cos(toRad(a.lat))*Math.sin(toRad(b.lat)) - Math.sin(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.cos(toRad(b.lng-a.lng));
  return (toDeg(Math.atan2(y,x))+360)%360;
}
function destPoint(start, bearingDeg, dist){
  const R=6371000;
  const br=toRad(bearingDeg);
  const lat1=toRad(start.lat), lng1=toRad(start.lng);
  const lat2=Math.asin(Math.sin(lat1)*Math.cos(dist/R)+Math.cos(lat1)*Math.sin(dist/R)*Math.cos(br));
  const lng2=lng1+Math.atan2(Math.sin(br)*Math.sin(dist/R)*Math.cos(lat1), Math.cos(dist/R)-Math.sin(lat1)*Math.sin(lat2));
  return { lat: toDeg(lat2), lng: toDeg(lng2) };
}
function pointInPolygon(point, poly){
  let inside=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const xi=poly[i].lng, yi=poly[i].lat;
    const xj=poly[j].lng, yj=poly[j].lat;
    const intersect = ((yi>point.lat)!==(yj>point.lat)) &&
      (point.lng < (xj-xi)*(point.lat-yi)/(yj-yi)+xi);
    if(intersect) inside=!inside;
  }
  return inside;
}
function zoneCenter(zone){
  if(zone.type==='polygon'){
    let latSum=0,lngSum=0;
    zone.coords.forEach(p=>{ latSum+=p.lat; lngSum+=p.lng; });
    return { lat: latSum/zone.coords.length, lng: lngSum/zone.coords.length };
  }
  return { lat: zone.lat, lng: zone.lng };
}
function zoneRadius(zone){
  if(zone.type==='polygon'){
    const c = zoneCenter(zone);
    let max=0;
    zone.coords.forEach(p=>{ const d=haversine(c,p); if(d>max) max=d; });
    return max;
  }
  return zone.radius;
}
function fmtDist(m){
  if(m<1000) return Math.round(m)+' m';
  return (m/1000).toFixed(1)+' km';
}
function fmtDur(s){
  const min=Math.round(s/60);
  if(min<60) return min+' min';
  const h=Math.floor(min/60), m=min%60;
  return h+'h '+m+'min';
}

/* ---------- Toast ---------- */
let toastTimer;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'), 2600);
}

  map = L.map('map', { zoomControl:false }).setView([-34.9011, -56.1645], 14); // Montevideo por defecto
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom:19,
    attribution:'&copy; OpenStreetMap'
  }).addTo(map);
  L.control.zoom({position:'bottomleft'}).addTo(map);

  map.on('click', onMapClick);

  renderFavorites();
  renderZones();
}

  if(placingZone){
    zonePendingCenter = { lat: e.latlng.lat, lng: e.latlng.lng };
    placingZone = false;
    document.getElementById('btnZone').classList.remove('on');
    openNameModal('Radio de la zona (metros)', '200', (val)=>{
      const radius = parseFloat(val) || 200;
      openNameModal('Nombre de la zona', 'Ej: obra, corte de calle...', (label)=>{
        const zone = { id: Date.now().toString(), type:'circle', lat: zonePendingCenter.lat, lng: zonePendingCenter.lng, radius, name: label || 'Zona a evitar' };
        zonas.push(zone);
        saveZones(zonas);
        renderZones();
        toast('Zona marcada para evitar');
      });
    }, '200');
    return;
  }
  if(corridorMode==='a'){
    corridorPointA = { lat: e.latlng.lat, lng: e.latlng.lng };
    corridorMode = 'b';
    toast('Ahora tocá el punto final del tramo');
    return;
  }
  if(corridorMode==='b'){
    const corridorPointB = { lat: e.latlng.lat, lng: e.latlng.lng };
    corridorMode = null;
    openNameModal('Ancho a los costados (metros)', '60', (val)=>{
      const buffer = parseFloat(val) || 60;
      openNameModal('Nombre de la zona', 'Ej: Maratón — Bulevar Artigas', (label)=>{
        const coords = corridorToPolygon(corridorPointA, corridorPointB, buffer);
        const zone = { id: Date.now().toString(), type:'polygon', kind:'corridor', coords, name: label || 'Tramo de calle', anchoM: buffer };
        zonas.push(zone);
        saveZones(zonas);
        renderZones();
        toast('Tramo marcado para evitar');
      });
    }, '60');
    return;
  }
  if(placingOrigin){
    myPos = { lat: e.latlng.lat, lng: e.latlng.lng };
    updateMyMarker(null);
    placingOrigin = false;
    document.getElementById('btnSetOrigin').classList.remove('on');
    toast('Punto de partida marcado a mano');
    if(destPos) calculateRoute();
    return;
  }
  // click normal: fija destino
  setDestination(e.latlng.lat, e.latlng.lng, 'Destino');
}

/* ---------- Ubicación en vivo ---------- */
function initGeolocation(){
  if(!navigator.geolocation){
    toast('Este navegador no soporta geolocalización');
    return;
  }
  navigator.geolocation.watchPosition(pos=>{
    myPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
    updateMyMarker(pos.coords.accuracy);
    updateFootstepsProgress();
    checkOffRoute();
    // si ya hay un destino puesto (por ejemplo, uno que estabas siguiendo y recién
    // llegó tu ubicación) pero todavía no se dibujó ninguna ruta, la calculamos ahora.
    if(destPos && !routeCoordsRef) calculateRoute();
  }, err=>{
    toast('No pude obtener tu ubicación — tocá 📌 para marcarla a mano');
  }, { enableHighAccuracy:true, maximumAge:2000, timeout:15000 });
}

function updateMyMarker(accuracy){
  if(!myMarker){
    const icon = L.divIcon({
      className:'',
      html:'<div style="width:16px;height:16px;border-radius:50%;background:#4da3ff;border:3px solid #fff;box-shadow:0 0 0 2px rgba(77,163,255,0.4);"></div>',
      iconSize:[16,16], iconAnchor:[8,8]
    });
    myMarker = L.marker([myPos.lat,myPos.lng], {icon, zIndexOffset:1000}).addTo(map);
    map.setView([myPos.lat,myPos.lng], 16);
  } else {
    myMarker.setLatLng([myPos.lat,myPos.lng]);
  }
  if(accuracy){
    if(!myAccCircle){
      myAccCircle = L.circle([myPos.lat,myPos.lng], {radius:accuracy, color:'#4da3ff', weight:1, fillOpacity:0.08}).addTo(map);
    } else {
      myAccCircle.setLatLng([myPos.lat,myPos.lng]);
      myAccCircle.setRadius(accuracy);
    }
  }
}

/* ---------- Zonas a evitar ---------- */
function renderZones(){
  Object.values(zoneLayers).forEach(l=>map.removeLayer(l));
  zoneLayers = {};
  const zoneStyle = { color:'#4a0f0f', weight:2, fillColor:'#7a1f1f', fillOpacity:0.32, dashArray:'5,4', interactive:false };
  zonas.forEach(z=>{
    let layer;
    if(z.type==='polygon'){
      layer = L.polygon(z.coords.map(c=>[c.lat,c.lng]), zoneStyle).addTo(map);
    } else {
      layer = L.circle([z.lat,z.lng], { ...zoneStyle, radius:z.radius }).addTo(map);
    }
    layer.bindPopup(z.name);
    zoneLayers[z.id]=layer;
  });
  const list = document.getElementById('zoneList');
  list.innerHTML='';
  if(zonas.length===0){
    list.innerHTML='<div class="empty-msg">No marcaste zonas a evitar.</div>';
  }
  zonas.forEach(z=>{
    const div=document.createElement('div');
    div.className='list-item';
    let sub;
    if(z.kind==='corridor') sub = `Tramo de calle · ${Math.round(z.anchoM||60)} m a cada lado`;
    else if(z.kind==='barrio') sub = 'Límite real del barrio';
    else if(z.type==='polygon') sub = 'Límite real del barrio'; // zonas viejas sin kind (compatibilidad)
    else sub = `Radio ${Math.round(z.radius)} m`;
    div.innerHTML=`<div class="info"><span class="name">${z.name}</span><span class="sub">${sub}</span></div>`;
    const del=document.createElement('button');
    del.textContent='✕';
    del.onclick=()=> deleteZone(z.id);
    div.appendChild(del);
    list.appendChild(div);
  });
}
function deleteZone(id){
  zonas = zonas.filter(z=>z.id!==id);
  saveZones(zonas);
  renderZones();
  toast('Zona eliminada');
}

/* ---------- Buscar destino (Nominatim) ---------- */
async function searchPlace(query){
  if(!query.trim()) return;
  try{
    const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(query)}`;
    const res = await fetch(url);
    const data = await res.json();
    if(data.length===0){ toast('No encontré ese lugar'); return; }
    const r=data[0];
    setDestination(parseFloat(r.lat), parseFloat(r.lon), r.display_name.split(',')[0]);
  }catch(e){
    toast('Error buscando el lugar');
  }
}

/* ---------- Destino y ruta ---------- */
const STORAGE_KEY_DESTINO = 'mimapa_destino_activo';
function saveDestinoActivo(lat,lng,name){
  localStorage.setItem(STORAGE_KEY_DESTINO, JSON.stringify({lat,lng,name}));
}
function clearDestinoActivo(){
  localStorage.removeItem(STORAGE_KEY_DESTINO);
}

function setDestination(lat,lng,name){
  destPos = {lat,lng};
  if(destMarker) map.removeLayer(destMarker);
  destMarker = L.marker([lat,lng], {title:name}).addTo(map).bindPopup(name).openPopup();
  saveDestinoActivo(lat,lng,name);
  if(!myPos){ toast('Esperando tu ubicación...'); return; }
  calculateRoute();
}

async function fetchOSRM(waypoints, profile){
  const coords = waypoints.map(p=>`${p.lng},${p.lat}`).join(';');
  const url = `https://router.project-osrm.org/route/v1/${profile}/${coords}?overview=full&geometries=geojson`;
  const res = await fetch(url);
  const data = await res.json();
  if(data.code!=='Ok') throw new Error('sin ruta');
  const route = data.routes[0];
  return {
    coords: route.geometry.coordinates.map(c=>({lat:c[1], lng:c[0]})),
    distance: route.distance,
    duration: route.duration
  };
}

function routeIntersectsZone(coords, zone){
  if(zone.type==='polygon'){
    return coords.some(p=>pointInPolygon(p, zone.coords));
  }
  for(const p of coords){
    if(haversine(p, {lat:zone.lat,lng:zone.lng}) < zone.radius) return true;
  }
  return false;
}
function firstIntersectingZone(coords){
  for(const z of zonas){
    if(routeIntersectsZone(coords, z)) return z;
  }
  return null;
}
function closestIndexToPoint(coords, point){
  let best=0, bestD=Infinity;
  coords.forEach((c,i)=>{
    const d=haversine(c,point);
    if(d<bestD){ bestD=d; best=i; }
  });
  return best;
}
function pointInZone(point, zone){
  if(zone.type==='polygon') return pointInPolygon(point, zone.coords);
  return haversine(point, {lat:zone.lat,lng:zone.lng}) < zone.radius;
}
function pushOutward(point, center, extraDist){
  const br = bearing(center, point);
  const distFromCenter = haversine(center, point);
  return destPoint(center, br, distFromCenter + extraDist);
}
// en vez de un único punto "genérico" para el costado, busca dónde el camino ENTRA
// y dónde SALE de la zona, y empuja esos dos puntos hacia afuera del borde —
// abraza mucho mejor la forma real de barrios grandes o irregulares.
function computeBypassPoints(coords, zone, extraDist){
  const center = zoneCenter(zone);
  let entryIdx=-1, exitIdx=-1;
  for(let i=0;i<coords.length;i++){
    if(pointInZone(coords[i], zone)){
      if(entryIdx===-1) entryIdx=i;
      exitIdx=i;
    }
  }
  if(entryIdx===-1) return [];
  const entryPoint = coords[Math.max(0, entryIdx-1)];
  const exitPoint = coords[Math.min(coords.length-1, exitIdx+1)];
  if(entryIdx===exitIdx){
    return [ pushOutward(entryPoint, center, extraDist) ];
  }
  return [ pushOutward(entryPoint, center, extraDist), pushOutward(exitPoint, center, extraDist) ];
}

async function obtenerRutaEvitandoZonas(waypointsBase){
  let route = await fetchOSRM(waypointsBase, currentProfile);
  const rutaDirecta = route.coords;
  let warn = false;
  const zonaCruzada = firstIntersectingZone(rutaDirecta);
  if(zonaCruzada){
    let mejorRuta = route;
    let sigueCruzando = true;
    const idxDest = waypointsBase.length - 1;
    for(const extra of [300, 700]){
      if(!sigueCruzando) break;
      const vias = computeBypassPoints(rutaDirecta, zonaCruzada, extra);
      if(vias.length===0) break;
      try{
        const candidata = await fetchOSRM([...waypointsBase.slice(0,idxDest), ...vias, waypointsBase[idxDest]], currentProfile);
        sigueCruzando = !!firstIntersectingZone(candidata.coords);
        mejorRuta = candidata;
      }catch(e){ /* seguimos con el siguiente intento */ }
    }
    route = mejorRuta;
    warn = sigueCruzando;
  }
  route.warn = warn;
  return route;
}

// Genera una ruta alternativa "de verdad distinta" empujando un punto de paso hacia
// un costado, a mitad de camino. OSRM (el servicio gratuito que usamos) no siempre
// ofrece alternativas reales para caminar, así que la forzamos así.
async function obtenerRutaAlternativa(base){
  const mid = base.coords[Math.floor(base.coords.length/2)];
  const brg = bearing(myPos, destPos);
  const offset = Math.min(Math.max(base.distance * 0.15, 150), 900);
  const intentos = [ destPoint(mid,(brg+90)%360,offset), destPoint(mid,(brg-90+360)%360,offset) ];
  let mejor = null;
  for(const via of intentos){
    try{
      const alt = await obtenerRutaEvitandoZonas([myPos, via, destPos]);
      const dif = Math.abs(alt.distance - base.distance) / base.distance;
      if(dif > 0.04 && (!mejor || alt.distance < mejor.distance)) mejor = alt;
    }catch(e){ /* seguimos con el otro lado */ }
  }
  return mejor;
}

// Trae los semáforos (nodos de OpenStreetMap) dentro del área que cubren las rutas candidatas.
async function fetchSemaforos(candidatas){
  let minLat=Infinity,maxLat=-Infinity,minLng=Infinity,maxLng=-Infinity;
  candidatas.forEach(c=> c.coords.forEach(p=>{
    if(p.lat<minLat)minLat=p.lat; if(p.lat>maxLat)maxLat=p.lat;
    if(p.lng<minLng)minLng=p.lng; if(p.lng>maxLng)maxLng=p.lng;
  }));
  const buf=0.003;
  const query = `[out:json][timeout:25][bbox:${minLat-buf},${minLng-buf},${maxLat+buf},${maxLng+buf}];\nnode["highway"="traffic_signals"];\nout body;`;
  const url = 'https://overpass-api.de/api/interpreter?data='+encodeURIComponent(query);
  const res = await fetch(url);
  if(!res.ok) throw new Error('overpass no respondió');
  const data = await res.json();
  return (data.elements||[]).map(el=>({lat:el.lat, lng:el.lon}));
}
function contarSemaforosCerca(coords, semaforos, radioM){
  let count=0;
  for(const s of semaforos){
    for(const p of coords){
      if(haversine(p,s) < radioM){ count++; break; }
    }
  }
  return count;
}

async function calculateRoute(){
  if(!myPos || !destPos) return;
  toast('Calculando ruta...');

  let rapida;
  try{
    rapida = await obtenerRutaEvitandoZonas([myPos, destPos]);
  }catch(e){
    toast('No pude calcular la ruta para ese modo/lugar');
    return;
  }
  const candidatas = [{ ...rapida, label:'Más rápida', color:'#2f6fb0', key:'rapida' }];

  try{
    const alt = await obtenerRutaAlternativa(rapida);
    if(alt) candidatas.push({ ...alt, label:'Alternativa', color:'#3a7d44', key:'alternativa' });
  }catch(e){ /* sin alternativa, seguimos solo con la más rápida */ }

  if(candidatas.length > 1){
    try{
      const semaforos = await fetchSemaforos(candidatas);
      candidatas.forEach(c => c.semaforos = contarSemaforosCerca(c.coords, semaforos, 28));
      const conMas = candidatas.reduce((a,b)=> b.semaforos > a.semaforos ? b : a);
      if(conMas.key !== 'rapida' && conMas.semaforos > candidatas[0].semaforos){
        conMas.label = 'Con semáforos';
        conMas.key = 'semaforos';
      }
    }catch(e){ /* sin datos de semáforos, mostramos las rutas igual sin ese detalle */ }
  }

  mostrarOpcionesDeRuta(candidatas);
}

function mostrarOpcionesDeRuta(candidatas){
  // limpiar las líneas de la ronda anterior
  rutasActuales.forEach(c=>{ if(c.linea) map.removeLayer(c.linea); });

  candidatas.forEach(c=>{
    c.linea = L.polyline(c.coords.map(p=>[p.lat,p.lng]), {color:c.color, weight:4, opacity:0.55, dashArray:'1,7'}).addTo(map);
  });
  rutasActuales = candidatas;

  const grupo = L.featureGroup(candidatas.map(c=>c.linea));
  map.fitBounds(grupo.getBounds(), {padding:[60,60]});

  const elegida = candidatas.find(c=>c.key===criterioRuta) || candidatas[0];
  activarRuta(elegida);
  renderRouteChips(candidatas, elegida.key);
}

function activarRuta(elegida){
  rutasActuales.forEach(c=>{
    if(c.linea) c.linea.setStyle({ opacity: c===elegida ? 0.9 : 0.3, weight: c===elegida ? 5 : 3 });
  });
  criterioRuta = elegida.key;
  buildFootsteps(elegida);

  document.getElementById('routeInfo').classList.add('show');
  document.getElementById('routeDist').textContent = fmtDist(elegida.distance);
  document.getElementById('routeDur').textContent = fmtDur(elegida.duration);
  document.getElementById('routeWarn').style.display = elegida.warn ? 'block' : 'none';
}

function renderRouteChips(candidatas, activaKey){
  const cont = document.getElementById('routeChips');
  cont.innerHTML = '';
  if(candidatas.length < 2) return;
  candidatas.forEach(c=>{
    const b = document.createElement('button');
    b.className = 'route-chip' + (c.key===activaKey ? ' active' : '');
    const semTxt = (c.semaforos!==undefined) ? ` · ${c.semaforos} cruces` : '';
    b.innerHTML = `<span class="dot" style="background:${c.color}"></span>${c.label} · ${fmtDur(c.duration)}${semTxt}`;
    b.onclick = ()=>{
      activarRuta(c);
      renderRouteChips(candidatas, c.key);
    };
    cont.appendChild(b);
  });
}

function clearRoute(){
  rutasActuales.forEach(c=>{ if(c.linea) map.removeLayer(c.linea); });
  rutasActuales = [];
  criterioRuta = null;
  document.getElementById('routeChips').innerHTML = '';
  if(destMarker){ map.removeLayer(destMarker); destMarker=null; }
  clearFootsteps();
  destPos=null;
  clearDestinoActivo();
  document.getElementById('routeInfo').classList.remove('show');
}

/* ---------- Huellas de pasos (estilo Mapa del Merodeador) ---------- */
let footstepMarkers = [];  // [{marker, cumDist, faded}]
let routeCumDist = [];     // distancia acumulada paralela a routeCoordsRef
let routeCoordsRef = null;

function buildFootsteps(route){
  clearFootsteps();
  const coords = route.coords;
  const cum=[0];
  for(let i=1;i<coords.length;i++){
    cum.push(cum[i-1] + haversine(coords[i-1], coords[i]));
  }
  const total = cum[cum.length-1];
  const spacing = 16; // metros entre cada huella
  let nextDist = spacing;
  let side = 0;
  let idx = 0;
  while(nextDist < total){
    while(idx < cum.length-2 && cum[idx+1] < nextDist) idx++;
    const a = coords[idx], b = coords[idx+1];
    const segLen = (cum[idx+1]-cum[idx]) || 1;
    const t = (nextDist-cum[idx])/segLen;
    const lat = a.lat + (b.lat-a.lat)*t;
    const lng = a.lng + (b.lng-a.lng)*t;
    const brg = bearing(a,b);
    const p = destPoint({lat,lng}, brg + (side===0?90:-90), 2.2); // pequeño paso alternado a cada lado
    const icon = L.divIcon({
      className:'footstep-icon',
      html:`<div class="footstep"></div>`,
      iconSize:[7,7], iconAnchor:[3,3]
    });
    const m = L.marker([p.lat,p.lng], {icon, interactive:false, zIndexOffset:100}).addTo(map);
    footstepMarkers.push({ marker:m, cumDist:nextDist, faded:false });
    side = 1-side;
    nextDist += spacing;
  }
  routeCumDist = cum;
  routeCoordsRef = coords;
}
function clearFootsteps(){
  footstepMarkers.forEach(f=>map.removeLayer(f.marker));
  footstepMarkers=[];
  routeCumDist=[];
  routeCoordsRef=null;
}
function updateFootstepsProgress(){
  if(!myPos || footstepMarkers.length===0 || !routeCoordsRef) return;
  const idx = closestIndexToPoint(routeCoordsRef, myPos);
  const traveled = routeCumDist[idx] || 0;
  footstepMarkers.forEach(f=>{
    if(!f.faded && f.cumDist < traveled - 8){
      f.faded = true;
      const el = f.marker.getElement();
      if(el){ el.style.transition='opacity 1.2s'; el.style.opacity='0'; }
      setTimeout(()=>{ if(footstepMarkers.includes(f)) map.removeLayer(f.marker); }, 1300);
    }
  });
}

/* ---------- Recalcular sola si te desviaste del camino ---------- */
let lastRecalcTime = 0;
const DESVIO_METROS = 40;       // qué tan lejos del trazado antes de recalcular
const RECALC_COOLDOWN_MS = 15000; // no recalcular más de una vez cada 15s

function checkOffRoute(){
  if(!myPos || !destPos || !routeCoordsRef || routeCoordsRef.length===0) return;
  const idx = closestIndexToPoint(routeCoordsRef, myPos);
  const distAlTrazado = haversine(myPos, routeCoordsRef[idx]);
  if(distAlTrazado > DESVIO_METROS && Date.now() - lastRecalcTime > RECALC_COOLDOWN_MS){
    lastRecalcTime = Date.now();
    toast('Te desviaste — recalculando ruta...');
    calculateRoute();
  }
}

document.getElementById('btnList').onclick=()=>{
  document.getElementById('bottomSheet').classList.toggle('open');
};
document.getElementById('sheetHandle').onclick=()=>{
  document.getElementById('bottomSheet').classList.remove('open');
};

document.getElementById('btnClearRoute').onclick=clearRoute;

/* ---------- Alternar mapa pergamino / normal ---------- */
const STORAGE_KEY_ESTILO = 'mimapa_estilo_normal';
function applyMapStyle(normal){
  document.body.classList.toggle('normal-map', normal);
  document.getElementById('btnToggleMap').classList.toggle('active', normal);
}
const estiloGuardado = localStorage.getItem(STORAGE_KEY_ESTILO) === '1';
applyMapStyle(estiloGuardado);
document.getElementById('btnToggleMap').onclick=()=>{
  const normalAhora = !document.body.classList.contains('normal-map');
  applyMapStyle(normalAhora);
  localStorage.setItem(STORAGE_KEY_ESTILO, normalAhora ? '1' : '0');
  toast(normalAhora ? 'Mapa normal' : 'Mapa del Merodeador');
};
document.getElementById('btnPreset').onclick = () => {
  const presetIds = new Set(PRESET_ZONES.map(p => 'preset-' + p.name));
  zonas = zonas.filter(z => !presetIds.has(z.id)); // saca versiones viejas para refrescarlas
  PRESET_ZONES.forEach(p => {
    zonas.push({
      id: 'preset-' + p.name,
      type: p.type || 'polygon',
      coords: p.coords,
      lat: p.lat, lng: p.lng, radius: p.radius,
      name: p.name,
      presetName: p.name
    });
  });
  saveZones(zonas);
  renderZones();

  // saltar la cámara para que se vean todas las zonas recién cargadas
  const capas = Object.values(zoneLayers);
  if(capas.length){
    const grupo = L.featureGroup(capas);
    map.fitBounds(grupo.getBounds(), { padding:[40,40] });
  }
  toast(`${PRESET_ZONES.length} zonas cargadas/actualizadas`);
};

/* ---------- Arranque ---------- */
initMap();
initGeolocation();

// Si había un destino activo de la última vez que usaste la app, preguntamos si seguís yendo ahí.
(function retomarDestinoActivo(){
  try{
    const guardado = JSON.parse(localStorage.getItem(STORAGE_KEY_DESTINO));
    if(guardado && guardado.lat && guardado.lng){
      const seguir = confirm(`¿Seguís yendo a "${guardado.name}"?`);
      if(seguir){
        setDestination(guardado.lat, guardado.lng, guardado.name);
      } else {
        clearDestinoActivo();
      }
    }
  }catch(e){ /* no había nada guardado o estaba corrupto, seguimos normal */ }
})();

// Registrar el service worker para que funcione offline (mapa base, favoritos y zonas ya cargados)
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{ /* si falla, la app sigue andando normal online */ });
  });
}
</script>
