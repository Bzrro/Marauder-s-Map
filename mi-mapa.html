<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mi Mapa</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English&family=MedievalSharp&display=swap" rel="stylesheet">
<style>
  /* Nota: la tipografía "pergamino" (Google Fonts) y el filtro sepia sobre el mapa
     necesitan conexión a internet normal para cargar bien — en la vista previa de
     Claude puede no cargar la fuente, pero en GitHub Pages sí. */
  :root{
    --bg:#cdb98a;
    --panel:#3c2a1a;
    --panel2:#4d3722;
    --accent:#c9a227;
    --accent2:#7a2020;
    --text:#f2e6c8;
    --muted:#d8c79b;
    --border:#6b4f30;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:'IM Fell English',Georgia,'Times New Roman',serif;}
  #map{position:absolute;top:0;left:0;right:0;bottom:0;z-index:1;}
  /* tiñe las teselas de OpenStreetMap a tono sepia/pergamino */
  .leaflet-tile-pane{
    filter: sepia(0.75) saturate(2.1) hue-rotate(-18deg) brightness(0.92) contrast(1.05);
  }
  /* viñeta de bordes envejecidos alrededor del mapa */
  #map::after{
    content:'';position:absolute;inset:0;pointer-events:none;z-index:400;
    box-shadow: inset 0 0 10vw 3vw rgba(60,40,20,0.65);
  }
  h3, #modalTitle, #nameModal .box h3{font-family:'MedievalSharp',cursive;}

  #topbar{
    position:absolute;top:0;left:0;right:0;z-index:500;
    padding:10px;display:flex;gap:8px;
    background:linear-gradient(180deg,rgba(15,17,21,0.95),rgba(15,17,21,0));
    pointer-events:none;
  }
  #topbar > *{pointer-events:auto;}
  #search{
    flex:1;padding:12px 14px;border-radius:14px;border:1px solid var(--border);
    background:var(--panel);color:var(--text);font-size:15px;outline:none;
  }
  #search::placeholder{color:var(--muted);}
  #goBtn{
    padding:0 16px;border-radius:14px;border:none;background:var(--accent);
    color:#08131f;font-weight:600;font-size:15px;
  }

  #modeBar{
    position:absolute;top:60px;left:10px;right:10px;z-index:500;
    display:flex;gap:6px;pointer-events:none;
  }
  #modeBar > *{pointer-events:auto;}
  .mode-btn{
    padding:8px 12px;border-radius:20px;border:1px solid var(--border);
    background:var(--panel);color:var(--muted);font-size:13px;
  }
  .mode-btn.active{background:var(--accent);color:#08131f;border-color:var(--accent);font-weight:600;}

  #fabs{
    position:absolute;right:10px;bottom:90px;z-index:500;
    display:flex;flex-direction:column;gap:10px;
  }
  .fab{
    width:50px;height:50px;border-radius:50%;border:1px solid var(--border);
    background:var(--panel);color:var(--text);font-size:20px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 14px rgba(0,0,0,0.4);
  }
  .fab.danger{background:var(--accent2);color:#2a0505;border-color:var(--accent2);}
  .fab.on{background:var(--accent);color:#08131f;border-color:var(--accent);}

  #bottomSheet{
    position:absolute;left:0;right:0;bottom:0;z-index:600;
    background:var(--panel);border-top:1px solid var(--border);
    border-radius:18px 18px 0 0;
    max-height:60vh;overflow-y:auto;
    transform:translateY(100%);transition:transform .25s ease;
  }
  #bottomSheet.open{transform:translateY(0);}
  #sheetHandle{
    display:flex;justify-content:center;padding:8px 0 2px;
  }
  #sheetHandle span{width:36px;height:4px;border-radius:2px;background:var(--border);}
  #sheetContent{padding:6px 16px 20px;}
  #sheetContent h3{margin:8px 0;font-size:15px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
  .list-item{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 12px;background:var(--panel2);border-radius:12px;margin-bottom:8px;
  }
  .list-item .info{display:flex;flex-direction:column;gap:2px;}
  .list-item .name{font-size:14px;font-weight:600;}
  .list-item .sub{font-size:12px;color:var(--muted);}
  .list-item button{
    background:none;border:none;color:var(--accent2);font-size:18px;padding:4px 8px;
  }
  .empty-msg{color:var(--muted);font-size:13px;padding:8px 0 16px;}

  #routeInfo{
    position:absolute;left:10px;right:10px;bottom:10px;z-index:500;
    background:var(--panel);border:1px solid var(--border);border-radius:14px;
    padding:12px 14px;display:none;align-items:center;justify-content:space-between;
    box-shadow:0 4px 14px rgba(0,0,0,0.4);
  }
  #routeInfo.show{display:flex;}
  #routeInfo .txt{font-size:14px;}
  #routeInfo .txt b{font-size:16px;}
  #routeInfo .warn{color:#ffb84d;font-size:12px;display:block;margin-top:2px;}
  #routeInfo button{
    background:var(--panel2);border:1px solid var(--border);color:var(--text);
    border-radius:10px;padding:8px 12px;font-size:13px;
  }

  #toast{
    position:absolute;left:50%;top:14px;transform:translateX(-50%);
    background:var(--panel2);border:1px solid var(--border);
    padding:10px 16px;border-radius:10px;font-size:13px;z-index:900;
    opacity:0;pointer-events:none;transition:opacity .25s;
  }
  #toast.show{opacity:1;}

  .leaflet-container{background:var(--bg);}

  .footstep-icon{background:none;border:none;}
  .footstep-icon .footstep{
    font-size:13px;opacity:0.85;
    filter:sepia(1) saturate(3) hue-rotate(-15deg) brightness(0.6) drop-shadow(0 0 1px rgba(0,0,0,0.6));
  }

  #nameModal{
    position:absolute;inset:0;z-index:1000;background:rgba(0,0,0,0.5);
    display:none;align-items:center;justify-content:center;
  }
  #nameModal.show{display:flex;}
  #nameModal .box{
    background:var(--panel);border:1px solid var(--border);border-radius:16px;
    padding:20px;width:85%;max-width:340px;
  }
  #nameModal h3{margin:0 0 12px;font-size:16px;}
  #nameModal input{
    width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);
    background:var(--panel2);color:var(--text);font-size:14px;margin-bottom:12px;
  }
  #nameModal .row{display:flex;gap:8px;justify-content:flex-end;}
  #nameModal button{padding:9px 16px;border-radius:10px;border:none;font-size:14px;}
  #nameModal .cancel{background:var(--panel2);color:var(--muted);}
  #nameModal .ok{background:var(--accent);color:#08131f;font-weight:600;}
</style>
</head>
<body>

<div id="map"></div>

<div id="topbar">
  <input id="search" type="text" placeholder="Buscar destino..." />
  <button id="goBtn">Ir</button>
</div>

<div id="modeBar">
  <button class="mode-btn active" data-profile="foot">🚶 A pie</button>
  <button class="mode-btn" data-profile="bike">🚲 Bici</button>
  <button class="mode-btn" data-profile="driving">🚗 Auto</button>
</div>

<div id="fabs">
  <button class="fab" id="btnLocate" title="Mi ubicación">📍</button>
  <button class="fab" id="btnFavorite" title="Guardar lugar">⭐</button>
  <button class="fab danger" id="btnZone" title="Marcar zona a evitar">⛔</button>
  <button class="fab" id="btnList" title="Lugares y zonas">📋</button>
  <button class="fab" id="btnPreset" title="Cargar zonas sugeridas">📰</button>
</div>

<div id="routeInfo">
  <div class="txt">
    <b id="routeDist">--</b> · <span id="routeDur">--</span>
    <span class="warn" id="routeWarn" style="display:none;">⚠️ No se pudo evitar del todo una zona marcada</span>
  </div>
  <button id="btnClearRoute">Cancelar</button>
</div>

<div id="bottomSheet">
  <div id="sheetHandle"><span></span></div>
  <div id="sheetContent">
    <h3>Lugares favoritos</h3>
    <div id="favList"></div>
    <h3>Zonas a evitar</h3>
    <div id="zoneList"></div>
  </div>
</div>

<div id="toast"></div>

<div id="nameModal">
  <div class="box">
    <h3 id="modalTitle">Nombre del lugar</h3>
    <input id="modalInput" type="text" placeholder="Ej: Casa, Trabajo..." />
    <div class="row">
      <button class="cancel" id="modalCancel">Cancelar</button>
      <button class="ok" id="modalOk">Guardar</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ---------- Estado ---------- */
let map, myMarker, myAccCircle, destMarker, routeLine, zoneLayers = {};
let myPos = null;              // {lat,lng}
let destPos = null;            // {lat,lng}
let currentProfile = 'foot';
let placingZone = false;
let zonePendingCenter = null;
let pendingAction = null;      // 'favorite' | 'zone-radius'

const STORAGE_KEY_FAV = 'mimapa_favoritos';
const STORAGE_KEY_ZONES = 'mimapa_zonas';

function loadFavs(){ try{ return JSON.parse(localStorage.getItem(STORAGE_KEY_FAV)) || []; }catch(e){ return []; } }
function saveFavs(list){ localStorage.setItem(STORAGE_KEY_FAV, JSON.stringify(list)); }
function loadZones(){ try{ return JSON.parse(localStorage.getItem(STORAGE_KEY_ZONES)) || []; }catch(e){ return []; } }
function saveZones(list){ localStorage.setItem(STORAGE_KEY_ZONES, JSON.stringify(list)); }

let favoritos = loadFavs();
let zonas = loadZones();

/* Zonas sugeridas según notas de prensa (El Observador, ago-2023; InsightCrime/El País, nov-2024;
   El Observador feb-2023) sobre barrios con más homicidios/rapiñas o disputas de bandas en Montevideo.
   Al cargarlas, la app intenta traer el POLÍGONO REAL del barrio desde OpenStreetMap (Overpass API).
   Si no lo encuentra, usa como respaldo un círculo aproximado (lat/lng/radius de abajo). */
const PRESET_ZONES = [
  { name:'Casavalle', lat:-34.8273, lng:-56.1638, radius:700 },
  { name:'La Paloma', lat:-34.8220, lng:-56.1545, radius:600 },
  { name:'Manga', lat:-34.8080, lng:-56.1445, radius:800 },
  { name:'Peñarol', lat:-34.8345, lng:-56.2030, radius:700 },
  { name:'Lavalleja', lat:-34.8385, lng:-56.1995, radius:600 },
  { name:'Villa Española', lat:-34.8490, lng:-56.1520, radius:600 },
  { name:'Malvín Norte', lat:-34.8790, lng:-56.1160, radius:600 },
  { name:'Cerro', lat:-34.8680, lng:-56.2870, radius:900 },
  { name:'Cruz de Carrasco', lat:-34.8490, lng:-56.0560, radius:600 },
  { name:'Bañados de Carrasco', lat:-34.8440, lng:-56.0660, radius:700 },
  { name:'Marconi', lat:-34.8330, lng:-56.1740, radius:500 },
];

/* Busca el polígono real de uno o varios barrios de Montevideo en OpenStreetMap (Overpass API).
   Devuelve un objeto { "NombreBarrio": [{lat,lng}, ...] } solo con los que encontró. */
async function fetchBarrioPolygons(names){
  const escaped = names.map(n=>n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
  const pattern = escaped.join('|');
  const query = `[out:json][timeout:60][bbox:-34.95,-56.35,-34.75,-56.00];
(
  relation["name"~"^(${pattern})$",i]["boundary"="administrative"];
  way["name"~"^(${pattern})$",i]["boundary"="administrative"];
  relation["name"~"^(${pattern})$",i]["place"];
  way["name"~"^(${pattern})$",i]["place"];
);
out geom;`;
  const url = 'https://overpass-api.de/api/interpreter?data='+encodeURIComponent(query);
  const res = await fetch(url);
  if(!res.ok) throw new Error('overpass no respondió');
  const data = await res.json();
  const result = {};
  (data.elements||[]).forEach(el=>{
    const name = el.tags && el.tags.name;
    if(!name || result[name]) return;
    if(el.type==='way' && el.geometry && el.geometry.length>2){
      result[name] = el.geometry.map(p=>({lat:p.lat,lng:p.lon}));
    } else if(el.type==='relation' && el.members){
      const coords=[];
      el.members.forEach(m=>{
        if(m.role==='outer' && m.geometry){ m.geometry.forEach(p=>coords.push({lat:p.lat,lng:p.lon})); }
      });
      if(coords.length>2) result[name]=coords;
    }
  });
  return result;
}

/* ---------- Utilidades geo ---------- */
function toRad(d){ return d*Math.PI/180; }
function toDeg(r){ return r*180/Math.PI; }

function haversine(a,b){
  const R=6371000;
  const dLat=toRad(b.lat-a.lat), dLng=toRad(b.lng-a.lng);
  const s=Math.sin(dLat/2)**2 + Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}
function bearing(a,b){
  const y=Math.sin(toRad(b.lng-a.lng))*Math.cos(toRad(b.lat));
  const x=Math.cos(toRad(a.lat))*Math.sin(toRad(b.lat)) - Math.sin(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.cos(toRad(b.lng-a.lng));
  return (toDeg(Math.atan2(y,x))+360)%360;
}
function destPoint(start, bearingDeg, dist){
  const R=6371000;
  const br=toRad(bearingDeg);
  const lat1=toRad(start.lat), lng1=toRad(start.lng);
  const lat2=Math.asin(Math.sin(lat1)*Math.cos(dist/R)+Math.cos(lat1)*Math.sin(dist/R)*Math.cos(br));
  const lng2=lng1+Math.atan2(Math.sin(br)*Math.sin(dist/R)*Math.cos(lat1), Math.cos(dist/R)-Math.sin(lat1)*Math.sin(lat2));
  return { lat: toDeg(lat2), lng: toDeg(lng2) };
}
function pointInPolygon(point, poly){
  let inside=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const xi=poly[i].lng, yi=poly[i].lat;
    const xj=poly[j].lng, yj=poly[j].lat;
    const intersect = ((yi>point.lat)!==(yj>point.lat)) &&
      (point.lng < (xj-xi)*(point.lat-yi)/(yj-yi)+xi);
    if(intersect) inside=!inside;
  }
  return inside;
}
function zoneCenter(zone){
  if(zone.type==='polygon'){
    let latSum=0,lngSum=0;
    zone.coords.forEach(p=>{ latSum+=p.lat; lngSum+=p.lng; });
    return { lat: latSum/zone.coords.length, lng: lngSum/zone.coords.length };
  }
  return { lat: zone.lat, lng: zone.lng };
}
function zoneRadius(zone){
  if(zone.type==='polygon'){
    const c = zoneCenter(zone);
    let max=0;
    zone.coords.forEach(p=>{ const d=haversine(c,p); if(d>max) max=d; });
    return max;
  }
  return zone.radius;
}
function fmtDist(m){
  if(m<1000) return Math.round(m)+' m';
  return (m/1000).toFixed(1)+' km';
}
function fmtDur(s){
  const min=Math.round(s/60);
  if(min<60) return min+' min';
  const h=Math.floor(min/60), m=min%60;
  return h+'h '+m+'min';
}

/* ---------- Toast ---------- */
let toastTimer;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'), 2600);
}

/* ---------- Mapa ---------- */
function initMap(){
  map = L.map('map', { zoomControl:false }).setView([-34.9011, -56.1645], 14); // Montevideo por defecto
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom:19,
    attribution:'&copy; OpenStreetMap'
  }).addTo(map);
  L.control.zoom({position:'bottomleft'}).addTo(map);

  map.on('click', onMapClick);

  renderFavorites();
  renderZones();
}

function onMapClick(e){
  if(placingZone){
    zonePendingCenter = { lat: e.latlng.lat, lng: e.latlng.lng };
    placingZone = false;
    document.getElementById('btnZone').classList.remove('on');
    openNameModal('Radio de la zona (metros)', '200', (val)=>{
      const radius = parseFloat(val) || 200;
      const zone = { id: Date.now().toString(), type:'circle', lat: zonePendingCenter.lat, lng: zonePendingCenter.lng, radius, name: 'Zona a evitar' };
      zonas.push(zone);
      saveZones(zonas);
      renderZones();
      toast('Zona marcada para evitar');
    });
    return;
  }
  // click normal: fija destino
  setDestination(e.latlng.lat, e.latlng.lng, 'Destino');
}

/* ---------- Ubicación en vivo ---------- */
function initGeolocation(){
  if(!navigator.geolocation){
    toast('Este navegador no soporta geolocalización');
    return;
  }
  navigator.geolocation.watchPosition(pos=>{
    myPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
    updateMyMarker(pos.coords.accuracy);
    updateFootstepsProgress();
  }, err=>{
    toast('No se pudo obtener tu ubicación: '+err.message);
  }, { enableHighAccuracy:true, maximumAge:2000, timeout:15000 });
}

function updateMyMarker(accuracy){
  if(!myMarker){
    const icon = L.divIcon({
      className:'',
      html:'<div style="width:16px;height:16px;border-radius:50%;background:#4da3ff;border:3px solid #fff;box-shadow:0 0 0 2px rgba(77,163,255,0.4);"></div>',
      iconSize:[16,16], iconAnchor:[8,8]
    });
    myMarker = L.marker([myPos.lat,myPos.lng], {icon, zIndexOffset:1000}).addTo(map);
    map.setView([myPos.lat,myPos.lng], 16);
  } else {
    myMarker.setLatLng([myPos.lat,myPos.lng]);
  }
  if(accuracy){
    if(!myAccCircle){
      myAccCircle = L.circle([myPos.lat,myPos.lng], {radius:accuracy, color:'#4da3ff', weight:1, fillOpacity:0.08}).addTo(map);
    } else {
      myAccCircle.setLatLng([myPos.lat,myPos.lng]);
      myAccCircle.setRadius(accuracy);
    }
  }
}

/* ---------- Favoritos ---------- */
function renderFavorites(){
  // limpiar marcadores previos
  favoritos.forEach(f=>{
    if(f._marker) map.removeLayer(f._marker);
    const m = L.marker([f.lat,f.lng], { title:f.name }).addTo(map).bindPopup(f.name);
    m.on('click', ()=> setDestination(f.lat, f.lng, f.name));
    f._marker = m;
  });
  const list = document.getElementById('favList');
  list.innerHTML='';
  if(favoritos.length===0){
    list.innerHTML='<div class="empty-msg">Todavía no guardaste lugares.</div>';
  }
  favoritos.forEach(f=>{
    const div=document.createElement('div');
    div.className='list-item';
    div.innerHTML=`<div class="info"><span class="name">${f.name}</span><span class="sub">Tocá para ir</span></div>`;
    const del=document.createElement('button');
    del.textContent='✕';
    del.onclick=(ev)=>{ ev.stopPropagation(); deleteFavorite(f.id); };
    div.appendChild(del);
    div.onclick=()=> setDestination(f.lat, f.lng, f.name);
    list.appendChild(div);
  });
}
function deleteFavorite(id){
  const f = favoritos.find(x=>x.id===id);
  if(f && f._marker) map.removeLayer(f._marker);
  favoritos = favoritos.filter(x=>x.id!==id);
  saveFavs(favoritos.map(({_marker, ...rest})=>rest));
  renderFavorites();
}

/* ---------- Zonas a evitar ---------- */
function renderZones(){
  Object.values(zoneLayers).forEach(l=>map.removeLayer(l));
  zoneLayers = {};
  const zoneStyle = { color:'#4a0f0f', weight:2, fillColor:'#7a1f1f', fillOpacity:0.32, dashArray:'5,4' };
  zonas.forEach(z=>{
    let layer;
    if(z.type==='polygon'){
      layer = L.polygon(z.coords.map(c=>[c.lat,c.lng]), zoneStyle).addTo(map);
    } else {
      layer = L.circle([z.lat,z.lng], { ...zoneStyle, radius:z.radius }).addTo(map);
    }
    layer.bindPopup(z.name);
    zoneLayers[z.id]=layer;
  });
  const list = document.getElementById('zoneList');
  list.innerHTML='';
  if(zonas.length===0){
    list.innerHTML='<div class="empty-msg">No marcaste zonas a evitar.</div>';
  }
  zonas.forEach(z=>{
    const div=document.createElement('div');
    div.className='list-item';
    const sub = z.type==='polygon' ? 'Límite real del barrio' : `Radio ${Math.round(z.radius)} m`;
    div.innerHTML=`<div class="info"><span class="name">${z.name}</span><span class="sub">${sub}</span></div>`;
    const del=document.createElement('button');
    del.textContent='✕';
    del.onclick=()=> deleteZone(z.id);
    div.appendChild(del);
    list.appendChild(div);
  });
}
function deleteZone(id){
  zonas = zonas.filter(z=>z.id!==id);
  saveZones(zonas);
  renderZones();
  toast('Zona eliminada');
}

/* ---------- Modal de nombre/valor ---------- */
function openNameModal(title, placeholder, onOk){
  const modal=document.getElementById('nameModal');
  document.getElementById('modalTitle').textContent=title;
  const input=document.getElementById('modalInput');
  input.value='';
  input.placeholder=placeholder;
  modal.classList.add('show');
  input.focus();
  const ok=document.getElementById('modalOk');
  const cancel=document.getElementById('modalCancel');
  function cleanup(){
    modal.classList.remove('show');
    ok.onclick=null; cancel.onclick=null;
  }
  ok.onclick=()=>{ const v=input.value.trim(); cleanup(); if(v) onOk(v); };
  cancel.onclick=()=> cleanup();
}

/* ---------- Buscar destino (Nominatim) ---------- */
async function searchPlace(query){
  if(!query.trim()) return;
  try{
    const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(query)}`;
    const res = await fetch(url);
    const data = await res.json();
    if(data.length===0){ toast('No encontré ese lugar'); return; }
    const r=data[0];
    setDestination(parseFloat(r.lat), parseFloat(r.lon), r.display_name.split(',')[0]);
  }catch(e){
    toast('Error buscando el lugar');
  }
}

/* ---------- Destino y ruta ---------- */
function setDestination(lat,lng,name){
  destPos = {lat,lng};
  if(destMarker) map.removeLayer(destMarker);
  destMarker = L.marker([lat,lng], {title:name}).addTo(map).bindPopup(name).openPopup();
  if(!myPos){ toast('Esperando tu ubicación...'); return; }
  calculateRoute();
}

async function fetchOSRM(waypoints, profile){
  const coords = waypoints.map(p=>`${p.lng},${p.lat}`).join(';');
  const url = `https://router.project-osrm.org/route/v1/${profile}/${coords}?overview=full&geometries=geojson`;
  const res = await fetch(url);
  const data = await res.json();
  if(data.code!=='Ok') throw new Error('sin ruta');
  const route = data.routes[0];
  return {
    coords: route.geometry.coordinates.map(c=>({lat:c[1], lng:c[0]})),
    distance: route.distance,
    duration: route.duration
  };
}

function routeIntersectsZone(coords, zone){
  if(zone.type==='polygon'){
    return coords.some(p=>pointInPolygon(p, zone.coords));
  }
  for(const p of coords){
    if(haversine(p, {lat:zone.lat,lng:zone.lng}) < zone.radius) return true;
  }
  return false;
}
function firstIntersectingZone(coords){
  for(const z of zonas){
    if(routeIntersectsZone(coords, z)) return z;
  }
  return null;
}
function closestIndexToPoint(coords, point){
  let best=0, bestD=Infinity;
  coords.forEach((c,i)=>{
    const d=haversine(c,point);
    if(d<bestD){ bestD=d; best=i; }
  });
  return best;
}
function computeDetourPoint(coords, zone, side){
  const center = zoneCenter(zone);
  const radius = zoneRadius(zone);
  const idx = closestIndexToPoint(coords, center);
  const a = coords[Math.max(0,idx-3)];
  const b = coords[Math.min(coords.length-1, idx+3)];
  const localBearing = bearing(a,b);
  const offsetBearing = (localBearing + (side===0?90:-90) + 360) % 360;
  const dist = radius + 250;
  return destPoint(center, offsetBearing, dist);
}

async function calculateRoute(){
  if(!myPos || !destPos) return;
  toast('Calculando ruta...');
  let waypoints = [myPos, destPos];
  let route;
  try{
    route = await fetchOSRM(waypoints, currentProfile);
  }catch(e){
    toast('No pude calcular la ruta para ese modo/lugar');
    return;
  }

  let attempts=0, warn=false;
  while(attempts<4){
    const zone = firstIntersectingZone(route.coords);
    if(!zone) break;
    const via = computeDetourPoint(route.coords, zone, attempts%2);
    waypoints.splice(waypoints.length-1, 0, via);
    try{
      route = await fetchOSRM(waypoints, currentProfile);
    }catch(e){ break; }
    attempts++;
  }
  if(firstIntersectingZone(route.coords)) warn=true;

  drawRoute(route, warn);
}

function drawRoute(route, warn){
  if(routeLine) map.removeLayer(routeLine);
  // línea guía tenue debajo de las huellas, tipo trazo de tinta desvaída
  routeLine = L.polyline(route.coords.map(c=>[c.lat,c.lng]), {color:'#5a3a1a', weight:3, opacity:0.35, dashArray:'1,8'}).addTo(map);
  map.fitBounds(routeLine.getBounds(), {padding:[60,60]});
  buildFootsteps(route);

  document.getElementById('routeInfo').classList.add('show');
  document.getElementById('routeDist').textContent = fmtDist(route.distance);
  document.getElementById('routeDur').textContent = fmtDur(route.duration);
  document.getElementById('routeWarn').style.display = warn ? 'block' : 'none';
}

function clearRoute(){
  if(routeLine){ map.removeLayer(routeLine); routeLine=null; }
  if(destMarker){ map.removeLayer(destMarker); destMarker=null; }
  clearFootsteps();
  destPos=null;
  document.getElementById('routeInfo').classList.remove('show');
}

/* ---------- Huellas de pasos (estilo Mapa del Merodeador) ---------- */
let footstepMarkers = [];  // [{marker, cumDist, faded}]
let routeCumDist = [];     // distancia acumulada paralela a routeCoordsRef
let routeCoordsRef = null;

function buildFootsteps(route){
  clearFootsteps();
  const coords = route.coords;
  const cum=[0];
  for(let i=1;i<coords.length;i++){
    cum.push(cum[i-1] + haversine(coords[i-1], coords[i]));
  }
  const total = cum[cum.length-1];
  const spacing = 16; // metros entre cada huella
  let nextDist = spacing;
  let side = 0;
  let idx = 0;
  while(nextDist < total){
    while(idx < cum.length-2 && cum[idx+1] < nextDist) idx++;
    const a = coords[idx], b = coords[idx+1];
    const segLen = (cum[idx+1]-cum[idx]) || 1;
    const t = (nextDist-cum[idx])/segLen;
    const lat = a.lat + (b.lat-a.lat)*t;
    const lng = a.lng + (b.lng-a.lng)*t;
    const brg = bearing(a,b);
    const p = destPoint({lat,lng}, brg + (side===0?90:-90), 2.2); // pequeño paso alternado a cada lado
    const icon = L.divIcon({
      className:'footstep-icon',
      html:`<div class="footstep" style="transform:rotate(${brg}deg)">👣</div>`,
      iconSize:[16,16], iconAnchor:[8,8]
    });
    const m = L.marker([p.lat,p.lng], {icon, interactive:false, zIndexOffset:100}).addTo(map);
    footstepMarkers.push({ marker:m, cumDist:nextDist, faded:false });
    side = 1-side;
    nextDist += spacing;
  }
  routeCumDist = cum;
  routeCoordsRef = coords;
}
function clearFootsteps(){
  footstepMarkers.forEach(f=>map.removeLayer(f.marker));
  footstepMarkers=[];
  routeCumDist=[];
  routeCoordsRef=null;
}
function updateFootstepsProgress(){
  if(!myPos || footstepMarkers.length===0 || !routeCoordsRef) return;
  const idx = closestIndexToPoint(routeCoordsRef, myPos);
  const traveled = routeCumDist[idx] || 0;
  footstepMarkers.forEach(f=>{
    if(!f.faded && f.cumDist < traveled - 8){
      f.faded = true;
      const el = f.marker.getElement();
      if(el){ el.style.transition='opacity 1.2s'; el.style.opacity='0'; }
      setTimeout(()=>{ if(footstepMarkers.includes(f)) map.removeLayer(f.marker); }, 1300);
    }
  });
}

/* ---------- Eventos UI ---------- */
document.getElementById('goBtn').onclick=()=> searchPlace(document.getElementById('search').value);
document.getElementById('search').addEventListener('keydown', e=>{
  if(e.key==='Enter') searchPlace(e.target.value);
});

document.querySelectorAll('.mode-btn').forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentProfile = btn.dataset.profile;
    if(destPos) calculateRoute();
  };
});

document.getElementById('btnLocate').onclick=()=>{
  if(myPos) map.setView([myPos.lat,myPos.lng], 16);
  else toast('Todavía no tengo tu ubicación');
};

document.getElementById('btnFavorite').onclick=()=>{
  if(!myPos){ toast('Todavía no tengo tu ubicación'); return; }
  openNameModal('Nombre del lugar', 'Ej: Casa, Trabajo...', (name)=>{
    const fav = { id: Date.now().toString(), lat: myPos.lat, lng: myPos.lng, name };
    favoritos.push(fav);
    saveFavs(favoritos.map(({_marker, ...rest})=>rest));
    renderFavorites();
    toast('Lugar guardado: '+name);
  });
};

document.getElementById('btnZone').onclick=(e)=>{
  placingZone = !placingZone;
  e.target.classList.toggle('on', placingZone);
  toast(placingZone ? 'Tocá el mapa donde está la zona a evitar' : 'Cancelado');
};

document.getElementById('btnList').onclick=()=>{
  document.getElementById('bottomSheet').classList.toggle('open');
};
document.getElementById('sheetHandle').onclick=()=>{
  document.getElementById('bottomSheet').classList.remove('open');
};

document.getElementById('btnClearRoute').onclick=clearRoute;

document.getElementById('btnPreset').onclick=async ()=>{
  const existingPresets = new Set(zonas.map(z=>z.presetName).filter(Boolean));
  const faltantes = PRESET_ZONES.filter(p=>!existingPresets.has(p.name));
  if(faltantes.length===0){ toast('Ya tenés cargadas todas las zonas sugeridas'); return; }
  toast('Buscando los límites reales de los barrios...');
  let polygons = {};
  try{
    polygons = await fetchBarrioPolygons(faltantes.map(f=>f.name));
  }catch(e){
    toast('No pude traer los límites reales, uso zonas aproximadas');
  }
  faltantes.forEach(p=>{
    const poly = polygons[p.name];
    if(poly && poly.length>2){
      zonas.push({ id:'preset-'+p.name, type:'polygon', coords:poly, name:p.name, presetName:p.name });
    } else {
      zonas.push({ id:'preset-'+p.name, type:'circle', lat:p.lat, lng:p.lng, radius:p.radius, name:p.name+' (aprox.)', presetName:p.name });
    }
  });
  saveZones(zonas);
  renderZones();
  toast(faltantes.length+' zonas cargadas (revisalas y ajustalas si hace falta)');
};

/* ---------- Arranque ---------- */
initMap();
initGeolocation();
